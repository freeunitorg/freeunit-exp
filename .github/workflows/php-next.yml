name: PHP 8.6 RC and php-src next

# Two PHP lines in one manual check, kept apart on purpose:
#   - prerelease: a PHP release candidate tarball (8.6.0RC4), the thing that
#     will ship as 8.6.0;
#   - next: php-src git, i.e. what comes after 8.6.
# A finding on `next` is not a finding on the RC and the other way round, so
# the source and the ref are printed in the log and in the job name.
#
# Both lines build the tree, the PHP module and the three compressors, then
# prove gzip, br and zstd on the wire.

on:
  workflow_dispatch:
    inputs:
      php_source:
        description: 'prerelease = tarball, next = php-src git'
        type: choice
        options: ['prerelease', 'next']
        default: 'prerelease'
      php_tarball:
        description: 'prerelease only: tarball name, without the extension'
        required: false
        default: 'php-8.6.0RC4'
      php_base_url:
        description: 'prerelease only: directory that holds the tarball'
        required: false
        default: 'https://downloads.php.net/~mbeccati'
      php_ref:
        description: 'next only: php-src ref'
        required: false
        default: 'master'

permissions:
  contents: read

jobs:
  php-build:
    name: php-${{ inputs.php_source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf bison re2c pkg-config git \
            libssl-dev libpcre2-dev zlib1g-dev libzstd-dev libbrotli-dev

      - name: Fetch PHP (prerelease tarball)
        if: inputs.php_source == 'prerelease'
        env:
          TARBALL: ${{ inputs.php_tarball }}
          BASE: ${{ inputs.php_base_url }}
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/php-src-src"
          cd "$RUNNER_TEMP/php-src-src"
          curl -fsSLO "$BASE/$TARBALL.tar.xz"
          tar xf "$TARBALL.tar.xz"
          mv "$TARBALL" "$RUNNER_TEMP/php-src"
          echo "PHP_SOURCE=prerelease $TARBALL $BASE"

      - name: Fetch PHP (php-src git)
        if: inputs.php_source == 'next'
        env:
          REF: ${{ inputs.php_ref }}
        run: |
          set -eux
          git clone --depth 1 --branch "$REF" \
            https://github.com/php/php-src.git "$RUNNER_TEMP/php-src"
          cd "$RUNNER_TEMP/php-src"
          ./buildconf --force
          echo "PHP_SOURCE=next $REF $(git rev-parse HEAD)"

      - name: Build PHP
        run: |
          set -eux
          P="$RUNNER_TEMP/php"
          cd "$RUNNER_TEMP/php-src"
          grep -m1 'define PHP_VERSION ' main/php_version.h || true
          ./configure --prefix="$P/inst" \
            --disable-all --enable-cli --enable-embed=shared \
            --with-zlib \
            --disable-libxml --disable-dom \
            --without-sqlite3 --without-pdo-sqlite
          make -j"$(nproc)"
          make install
          "$P/inst/bin/php" -v
          "$P/inst/bin/php" -r 'var_dump(function_exists("gzencode"));'

      - name: Build unitd and the PHP module
        run: |
          set -eux
          P="$RUNNER_TEMP/php"
          ./configure --openssl \
            --zlib --zstd --brotli \
            --prefix="$RUNNER_TEMP/unit" \
            --statedir="$RUNNER_TEMP/state"
          ./configure php --config="$P/inst/bin/php-config" --lib-path="$P/inst/lib"
          make -j"$(nproc)"
          make -j"$(nproc)" php
          make install
          ls -l "$RUNNER_TEMP/unit/lib/unit/modules/"

      - name: Smoke test
        run: |
          set -eux
          P="$RUNNER_TEMP/php"
          U="$RUNNER_TEMP/unit"
          export LD_LIBRARY_PATH="$P/inst/lib"

          mkdir -p "$RUNNER_TEMP/www" "$RUNNER_TEMP/state"
          cat > "$RUNNER_TEMP/www/index.php" <<'PHP'
          <?php
          header('Content-Type: text/html');
          echo 'ok:', PHP_VERSION, "\n";
          for ($i = 0; $i < 400; $i++) {
              echo 'compression-probe-0123456789abcdef';
          }
          PHP

          "$U/sbin/unitd" --no-daemon \
            --control "unix:$RUNNER_TEMP/control.sock" \
            --statedir "$RUNNER_TEMP/state" \
            --pid "$RUNNER_TEMP/unit.pid" \
            --log "$RUNNER_TEMP/unit.log" \
            --tmpdir "$RUNNER_TEMP" &

          for _ in $(seq 60); do
            [ -S "$RUNNER_TEMP/control.sock" ] && break
            sleep 1
          done

          "$U/sbin/unitd" --version

          curl -sS --unix-socket "$RUNNER_TEMP/control.sock" -X PUT \
            --data-binary @- http://localhost/config <<JSON
          {"listeners":{"127.0.0.1:8080":{"pass":"applications/app"}},
           "settings":{"http":{"compression":{"types":["text/html*"],
             "compressors":[{"encoding":"gzip","level":1},
                            {"encoding":"br","level":1},
                            {"encoding":"zstd","level":1}]}}},
           "applications":{"app":{"type":"php","root":"$RUNNER_TEMP/www","script":"index.php"}}}
          JSON
          echo

          curl -sS http://127.0.0.1:8080/ | head -c 200
          echo

          for enc in gzip br zstd; do
            curl -sS -H "Accept-Encoding: $enc" -D "$RUNNER_TEMP/h.$enc" \
              -o "$RUNNER_TEMP/b.$enc" http://127.0.0.1:8080/
            grep -qi "^content-encoding: $enc" "$RUNNER_TEMP/h.$enc" \
              || { echo "missing Content-Encoding: $enc"; exit 1; }
            printf '%-5s %s bytes\n' "$enc" "$(wc -c < "$RUNNER_TEMP/b.$enc")"
          done

      - name: Unit log
        if: always()
        run: tail -60 "$RUNNER_TEMP/unit.log" || true
