# Reverse proxy that presents a trusted cert downward and verifies the НУЦ
# upstream. Works with nginx and with Angie (same directives).
#
# Downward the clients trust *this* cert (a public-CA cert, or your own internal
# CA already deployed to the fleet). Upward the proxy verifies the RU origin
# against the Russian Trusted Root CA, held once on this host.

# The real RU origin (its IP), named by its НУЦ-signed certificate.
upstream nuc_origin {
    server 203.0.113.10:443;   # <-- the origin's IP; keep the real name for SNI
    keepalive 16;
}

server {
    listen      443 ssl;
    server_name service.example.ru;

    # Downward cert: what the LAN clients trust.
    ssl_certificate     /etc/nginx/tls/front-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/front.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass            https://nuc_origin;

        # Present the origin's hostname as SNI and verify its cert.
        proxy_ssl_server_name on;
        proxy_ssl_name        service.example.ru;

        # Trust the НУЦ chain: the root lives here, not on the clients.
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_trusted_certificate /etc/nginx/tls/russian_trusted_root_ca.pem;

        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
    }
}
